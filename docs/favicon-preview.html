<!doctype html>
<html lang="nl-BE">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMIGO — faviconvoorstel</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px; background: #eeebdd; color: #171a19; font: 14px/1.5 system-ui, sans-serif; }
  main { display: flex; align-items: center; gap: 40px; }
  .large { display: block; width: 256px; height: 256px; }
  h1 { margin: 0 0 12px; font-size: 24px; letter-spacing: -.03em; }
  p { margin: 0 0 24px; }
  .sizes { display: flex; align-items: center; gap: 24px; }
  figure { margin: 0; text-align: center; }
  figure img { display: block; margin-inline: auto; }
  figcaption { margin-top: 10px; font-size: 11px; }
  @media (max-width: 600px) { body { padding: 24px; } main { flex-wrap: wrap; gap: 24px; } }
</style>
<main>
  <img class="large" src="../src/assets/favicon.svg" alt="De Sora A uit AMIGO, ivory op een zwart vierkant">
  <section>
    <h1>AMIGO · A</h1>
    <p>Sora SemiBold · Ivory op AMIGO-black.</p>
    <div class="sizes">
      <figure><img src="../src/assets/favicon.svg" width="64" height="64" alt=""><figcaption>64 px</figcaption></figure>
      <figure><img src="../src/assets/favicon.svg" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
      <figure><img src="../src/assets/favicon.svg" width="16" height="16" alt=""><figcaption>16 px</figcaption></figure>
    </div>
  </section>
</main>
</html>
