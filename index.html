<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMIGO — Planner</title>
    <script>
      // Vóór de eerste paint het eventueel opgeslagen thema toepassen,
      // anders zie je eerst kort het verkeerde thema opflitsen. Dezelfde
      // sleutel ('amigo-theme') wordt gebruikt in src/utils/theme.js.
      (function () {
        try {
          var t = localStorage.getItem('amigo-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {
          /* localStorage niet beschikbaar: val terug op prefers-color-scheme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
